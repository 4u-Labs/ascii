<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="480" height="480" x="16" y="16" rx="96" fill="none" stroke="rgba(34, 197, 94, 0.35)" stroke-width="8"/>

  <!-- Terminal Window Bar -->
  <rect x="64" y="80" width="384" height="48" rx="12" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <circle cx="96" cy="104" r="8" fill="#ef4444"/>
  <circle cx="120" cy="104" r="8" fill="#eab308"/>
  <circle cx="144" cy="104" r="8" fill="#22c55e"/>

  <!-- Terminal Body Frame -->
  <rect x="64" y="128" width="384" height="304" rx="12" fill="#090d16" stroke="rgba(34, 197, 94, 0.3)" stroke-width="4"/>

  <!-- ASCII Pixel Graphic Representation (Geometric Shapes & Matrix Character Elements) -->
  <!-- Top ASCII Header Line -->
  <path d="M100 180 h60 M180 180 h40 M240 180 h80 M340 180 h70" stroke="url(#neonGreen)" stroke-width="10" stroke-linecap="round" filter="url(#neonGlow)"/>
  
  <!-- Image Frame Inside Terminal -->
  <rect x="100" y="210" width="312" height="150" rx="8" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="16 10"/>

  <!-- ASCII Art Mountain & Sun Matrix Shapes inside Frame -->
  <circle cx="340" cy="250" r="22" fill="#facc15" filter="url(#neonGlow)"/>
  
  <!-- Mountain ASCII ASCII Rows -->
  <path d="M130 330 L210 240 L270 330 Z" fill="url(#neonGreen)" filter="url(#neonGlow)"/>
  <path d="M230 330 L300 260 L380 330 Z" fill="#38bdf8" opacity="0.85"/>

  <!-- Bottom Terminal Status Prompt -->
  <path d="M100 400 L120 410 L100 420" fill="none" stroke="url(#neonGreen)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="140" y="406" width="80" height="8" rx="4" fill="url(#neonGreen)" filter="url(#neonGlow)"/>
</svg>
